<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Brushify</title>
</head>
<body>
    <center>
        <h1 style="color: rgba(72, 10, 85, 0.99);">Brushify</h1>
        <br><br><br>
        <div id="editor" contenteditable="true"></div>
        <br><br><br>
        <div id="parent">
            <div id="child">
                <h1>Backgroundcolor</h1>
                <br><br>
                <button class="bg" onclick="bgc('red')"  style="background-color: rgb(208, 31, 31);"></button>
                <button class="bg" onclick="bgc('brown')" style="background-color:rgb(201, 161, 51) ;" ></button>
                <button class="bg" onclick="bgc('pink')" style="background-color: pink;" ></button>
                <button class="bg" onclick="bgc('green')" style="background-color: rgb(10, 53, 10);" ></button>
                <button class="bg" onclick="bgc('blue')" style="background-color: rgb(86, 59, 172);" ></button>
            </div>
            <div id="child">
                <h1>Textcolor</h1>
                <br><br>
                <button class="bg" onclick="Textcolor('Blue')" style="background-color: blue; "></button>
                <button class="bg" onclick="Textcolor('yellow')" style="background-color: yellow"></button>
                <button class="bg" onclick="Textcolor('navy')" style="background-color: rgb(9, 105, 143);"></button>
                <button class="bg" onclick="Textcolor('purple')" style="background-color: rgb(64, 11, 64);"></button>
                <button class="bg" onclick="Textcolor('skyblue')" style="background-color: skyblue;"></button>
            </div>
            <div id="child">
                <h1>FontStyle</h1>
                <br><br>
                <button class="fnt" onclick="font('sans-serif')" >Hello</button>
                <button class="fnt" onclick="font('serif')"      >Hello</button>
                <button class="fnt" onclick="font('monospace')"  >Hello</button>
                <button class="fnt" onclick="font('cursive')"    >ℎ𝑒𝑙𝑙𝑜</button>
                <button class="fnt" onclick="font('fantasy')">Hello</button>
            </div>
        </div>
    </center>

    <script>
        function bgc(clr){
            document.getElementById('editor').style.backgroundColor = clr
        }
         function Textcolor(clr){
            document.getElementById('editor').style.color = clr
        }
         function font(font){
            document.getElementById('editor').style.fontFamily = font
        }
    </script>
    
</body>
</html>
